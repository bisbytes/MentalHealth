[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"

[vars]
# Sites allowed to turn reminders on, comma separated.
ALLOWED_ORIGINS = "https://mentalhealth.bisbytes.com"
VAPID_SUBJECT = "https://mentalhealth.bisbytes.com"
VAPID_PUBLIC_KEY = ""
